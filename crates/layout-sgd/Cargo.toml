[package]
name = "egraph-layout-sgd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded stochastic gradient descent stress and sparse barrier layout solvers for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-layout-sgd"
keywords = ["graph-drawing", "sgd", "stress", "layout", "sparse"]
categories = ["algorithms", "mathematics", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
egraph-linalg.workspace = true
egraph-neighborhood.workspace = true

[dev-dependencies]
egraph-linalg-mds.workspace = true
