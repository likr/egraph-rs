[package]
name = "egraph-spatial-fft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded 2D FFT, interpolation-based FFT, and screened Poisson density-field kernels for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-spatial-fft"
keywords = ["fft", "poisson", "density-field", "graph-drawing", "spatial"]
categories = ["algorithms", "mathematics", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
