[package]
name = "egraph-layout-neighbor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Neighborhood-preserving tsNET, GuMap, t-FDP, and ibUMAP graph layout solvers for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-layout-neighbor"
keywords = ["graph-drawing", "tsnet", "gumap", "umap", "t-fdp"]
categories = ["algorithms", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
egraph-spatial-trees.workspace = true
egraph-spatial-fft.workspace = true
egraph-neighborhood.workspace = true
