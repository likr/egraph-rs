[package]
name = "egraph-layout-embedding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded sampling-based neighborhood graph embedding layouts for egraph-rs"
readme = "README.md"
documentation = "https://docs.rs/egraph-layout-embedding"
keywords = ["graph-embedding", "pacmap", "largevis", "drgraph", "layout"]
categories = ["algorithms", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
egraph-linalg.workspace = true
egraph-neighborhood.workspace = true
egraph-clustering.workspace = true

[dev-dependencies]
egraph-linalg-mds.workspace = true
