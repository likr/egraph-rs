[package]
name = "egraph-python"
version = "6.0.0-beta.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
egraph = { workspace = true, features = [
    "spatial",
    "edge-routing",
    "linalg",
    "neighborhood",
    "layout",
    "clustering",
    "metrics",
    "baselines",
    "eval-baselines",
    "dataset",
    "dataset-embedded",
] }
egraph-ffi.workspace = true
pyo3.workspace = true
numpy.workspace = true
ndarray.workspace = true
