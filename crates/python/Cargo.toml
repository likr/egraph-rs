[package]
name = "egraph-python"
version = "6.0.0-alpha.9"
edition = "2024"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
egraph = { workspace = true, features = [
    "spatial",
    "linalg",
    "neighborhood",
    "layout",
    "clustering",
    "metrics",
    "baselines",
    "eval-baselines",
    "dataset",
    "delaunay",
] }
egraph-ffi.workspace = true
pyo3.workspace = true
numpy.workspace = true
ndarray.workspace = true
