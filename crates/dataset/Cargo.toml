[package]
name = "egraph-dataset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded benchmark datasets and synthetic graph generators for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-dataset"
keywords = ["graph", "dataset", "benchmark", "csr", "generator"]
categories = ["algorithms", "data-structures", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "src/data/*.csv"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
embedded = [
    "1138_bus",
    "3elt",
    "dwt_1005",
    "dwt_2680",
    "poli",
    "qh882",
    "USpowerGrid",
    "karate",
    "lesmis",
]
1138_bus = []
poli = []
USpowerGrid = []
qh882 = []
dwt_1005 = []
dwt_2680 = []
3elt = []
karate = []
lesmis = []

[dependencies]
egraph-core.workspace = true
