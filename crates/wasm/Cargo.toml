[package]
name = "egraph-wasm"
version = "6.0.0-alpha.8"
authors = ["Yosuke Onoue <onoue@likr-lab.com>"]
edition = "2024"
description = "WebAssembly binding of egraph."
repository = "https://github.com/likr/egraph-rs/tree/master/crates/wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["full"]
full = ["delaunay"]
delaunay = ["egraph/delaunay"]
legacy = [
    "dep:petgraph",
    "dep:petgraph-algorithm-shortest-path",
    "dep:petgraph-clustering",
    "dep:petgraph-drawing",
    "dep:petgraph-edge-bundling-fdeb",
    "dep:petgraph-linalg-kernel",
    "dep:petgraph-layout-kamada-kawai",
    "dep:petgraph-layout-mds",
    "dep:petgraph-layout-overwrap-removal",
    "dep:petgraph-layout-sgd",
    "dep:petgraph-layout-stress-majorization",
    "dep:petgraph-layout-ts-net",
    "dep:petgraph-layout-gumap",
    "dep:petgraph-quality-metrics",
    "dep:ndarray",
    "dep:rand",
    "dep:getrandom",
    "dep:serde",
    "dep:serde-wasm-bindgen",
]

[dependencies]
console_error_panic_hook = "0.1"
egraph = { workspace = true, default-features = false, features = [
    "spatial",
    "linalg",
    "neighborhood",
    "layout",
    "clustering",
    "metrics",
    "baselines",
    "eval-baselines",
] }
egraph-dataset = { workspace = true, default-features = false }
egraph-ffi.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true

getrandom = { version = "0.2", features = ["js"], optional = true }
ndarray = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
petgraph-algorithm-shortest-path = { path = "../algorithm/shortest-path", optional = true }
petgraph-clustering = { path = "../clustering", optional = true }
petgraph-drawing = { path = "../drawing", optional = true }
petgraph-edge-bundling-fdeb = { path = "../edge-bundling/fdeb", optional = true }
petgraph-linalg-kernel = { path = "../linalg/kernel", optional = true }
petgraph-layout-kamada-kawai = { path = "../layout/kamada-kawai", optional = true }
petgraph-layout-mds = { path = "../layout/mds", optional = true }
petgraph-layout-overwrap-removal = { path = "../layout/overwrap-removal", optional = true }
petgraph-layout-sgd = { path = "../layout/sgd", optional = true }
petgraph-layout-stress-majorization = { path = "../layout/stress-majorization", optional = true }
petgraph-layout-ts-net = { path = "../layout/ts-net", optional = true }
petgraph-layout-gumap = { path = "../layout/gumap", optional = true }
petgraph-quality-metrics = { path = "../quality-metrics", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
serde_json = "1.0"
wasm-bindgen-test = "0.3.54"

