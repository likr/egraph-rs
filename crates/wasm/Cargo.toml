required-features = ["legacy"]

[[test]]
name = "edge_bundling"
required-features = ["legacy"]

[[test]]
name = "graph"
required-features = ["legacy"]

[[test]]
name = "gumap"
required-features = ["legacy"]

[[test]]
name = "kamada_kawai"
required-features = ["legacy"]

[[test]]
name = "node"
required-features = ["legacy"]

[[test]]
