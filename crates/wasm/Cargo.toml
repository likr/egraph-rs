[package]
name = "egraph-wasm"
version = "6.0.0-alpha.8"
authors = ["Yosuke Onoue <onoue@likr-lab.com>"]
edition = "2024"
description = "WebAssembly binding of egraph."
repository = "https://github.com/likr/egraph-rs/tree/master/crates/wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["full"]
full = ["delaunay"]
delaunay = ["egraph/delaunay"]

[dependencies]
console_error_panic_hook = "0.1"
egraph = { workspace = true, default-features = false, features = [
    "spatial",
    "linalg",
    "neighborhood",
    "layout",
    "clustering",
    "metrics",
    "baselines",
    "eval-baselines",
] }
egraph-dataset = { workspace = true, default-features = false }
egraph-ffi.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json = "1.0"
wasm-bindgen-test = "0.3.54"

[[test]]
name = "coarsen_backbone_and_hde"

[[test]]
name = "community_clustering_and_backbone"

[[test]]
name = "csr_and_layout_buffers"

[[test]]
name = "force_multilevel_and_classic_solvers"

[[test]]
name = "grip_gem_sel_pfs_sfc_solvers"

[[test]]
name = "gumap_solver"

[[test]]
name = "linalg_neighborhood_boundaries"

[[test]]
name = "linalg_spectral_amg_resistance"

[[test]]
name = "manifold_layouts_and_fdeb"

