[package]
name = "egraph-wasm"
version = "6.0.0-beta.1"
authors = ["Yosuke Onoue <onoue@likr-lab.com>"]
edition = "2024"
rust-version.workspace = true
description = "WebAssembly binding of egraph."
repository = "https://github.com/likr/egraph-rs/tree/master/crates/wasm"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
console_error_panic_hook = "0.1"
egraph = { path = "../egraph", default-features = false, features = [
    "spatial",
    "edge-routing",
    "linalg",
    "neighborhood",
    "layout",
    "clustering",
    "metrics",
    "baselines",
    "eval-baselines",
    "dataset",
] }
egraph-ffi.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json = "1.0"
wasm-bindgen-test = "0.3.54"

[[test]]
name = "wasm_suite"
path = "tests/wasm_suite/main.rs"
