[package]
name = "egraph-spatial-trees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded spatial indexing trees, rectangle overlap sweep, and 2D Delaunay triangulation for egraph-rs"
readme = "README.md"
documentation = "https://docs.rs/egraph-spatial-trees"
keywords = ["spatial-index", "kdtree", "quadtree", "octree", "delaunay"]
categories = ["algorithms", "data-structures", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
spade.workspace = true
