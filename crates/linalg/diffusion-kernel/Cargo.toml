[package]
name = "petgraph-linalg-diffusion-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Yosuke Onoue <onoue@likr-lab.com>"]
license = "MIT"
description = "Diffusion kernel matrix estimation using Chebyshev polynomials and Hutchinson trace estimator"
repository = "https://github.com/likr/egraph-rs"

[dependencies]
ndarray = "0.16"
num-traits = "0.2"
petgraph = "0.8"
petgraph-drawing = { path = "../../drawing" }
petgraph-distance = { path = "../distance" }
petgraph-linalg-rdmds = { path = "../rdmds" }
rand = "0.8"
