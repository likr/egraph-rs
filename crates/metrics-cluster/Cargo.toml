[package]
name = "egraph-metrics-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded cluster-area faithfulness, community, and clustering baseline metrics for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-metrics-cluster"
keywords = ["graph-metrics", "clustering", "faithfulness", "community", "evaluation"]
categories = ["algorithms", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
eval-baselines = ["dep:egraph-clustering", "dep:egraph-spatial-trees", "dep:egraph-metrics-geometry"]

[dependencies]
egraph-core.workspace = true
egraph-spatial-trees = { workspace = true, optional = true }
egraph-metrics-geometry = { workspace = true, optional = true }
egraph-clustering = { workspace = true, optional = true }
