[package]
name = "egraph-layout-constraints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Separation constraints, hierarchical layering, and 2D node overlap removal solvers for egraph-rs"
readme = "README.md"
documentation = "https://docs.rs/egraph-layout-constraints"
keywords = ["graph-drawing", "overlap-removal", "vpsc", "dag", "constraints"]
categories = ["algorithms", "graphics", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
baselines = []

[dependencies]
egraph-core.workspace = true
egraph-spatial-trees.workspace = true
