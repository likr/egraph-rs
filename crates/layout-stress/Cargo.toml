[package]
name = "egraph-layout-stress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kamada-Kawai, stress majorization, and maxent-stress graph layout solvers for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-layout-stress"
keywords = ["graph-drawing", "stress", "kamada-kawai", "maxent", "layout"]
categories = ["algorithms", "mathematics", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
baselines = [
    "dep:egraph-linalg-mds",
    "dep:egraph-linalg-amg",
    "dep:egraph-spatial-trees",
]

[dependencies]
egraph-core.workspace = true
egraph-linalg.workspace = true
egraph-linalg-mds = { workspace = true, optional = true }
egraph-linalg-amg = { workspace = true, optional = true }
egraph-spatial-trees = { workspace = true, optional = true }
