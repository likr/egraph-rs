[package]
name = "egraph-layout-stress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kamada-Kawai, stress majorization, and maxent-stress graph layout solvers for egraph-rs"

[features]
default = []
baselines = [
    "dep:egraph-linalg-mds",
    "dep:egraph-linalg-amg",
    "dep:egraph-spatial-trees",
]

[dependencies]
egraph-core.workspace = true
egraph-linalg.workspace = true
egraph-linalg-mds = { workspace = true, optional = true }
egraph-linalg-amg = { workspace = true, optional = true }
egraph-spatial-trees = { workspace = true, optional = true }
