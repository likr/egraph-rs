[package]
name = "egraph-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified single-threaded graph layout evaluation metrics dispatcher for egraph-rs"
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egraph-metrics"
keywords = ["graph-metrics", "evaluation", "layout", "stress", "neighborhood"]
categories = ["algorithms", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
eval-baselines = ["egraph-metrics-cluster/eval-baselines"]

[dependencies]
egraph-core.workspace = true
egraph-spatial-trees.workspace = true
egraph-metrics-geometry.workspace = true
egraph-metrics-cluster.workspace = true
