[package]
name = "egraph-neighborhood"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded neighborhood graph, adaptive perplexity, fuzzy simplicial set, and Varadhan landmark primitives for egraph-rs"
readme = "README.md"
documentation = "https://docs.rs/egraph-neighborhood"
keywords = ["knn", "perplexity", "umap", "varadhan", "graph"]
categories = ["algorithms", "data-structures", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
egraph-spatial-trees.workspace = true
egraph-linalg.workspace = true
egraph-linalg-amg.workspace = true
