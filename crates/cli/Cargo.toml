[package]
name = "egraph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command-line graph layout, metrics, clustering, and benchmarking tool for egraph-rs."

[[bin]]
name = "egraph"
path = "src/main.rs"

[dependencies]
clap.workspace = true
egraph = { workspace = true, features = ["layout", "metrics", "clustering", "baselines", "eval-baselines", "dataset", "dataset-embedded"] }
serde.workspace = true
serde_json.workspace = true
