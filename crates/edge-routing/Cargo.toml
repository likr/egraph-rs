[package]
name = "egraph-edge-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-threaded edge routing and edge bundling algorithms for egraph-rs"
readme = "README.md"
documentation = "https://docs.rs/egraph-edge-routing"
keywords = ["graph", "edge-bundling", "edge-routing", "fdeb", "polylines"]
categories = ["algorithms", "graphics", "science"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
egraph-core.workspace = true
