[package]
name = "egraph-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["delaunay"]
delaunay = [
    "egraph-layout-constraints/delaunay",
    "egraph-layout-multilevel/delaunay",
    "egraph-layout-sgd/delaunay",
]
baselines = [
    "egraph-layout-constraints/baselines",
    "egraph-layout-force/baselines",
    "egraph-layout-multilevel/baselines",
    "egraph-layout-stress/baselines",
]

[dependencies]
egraph-layout-constraints.workspace = true
egraph-layout-force.workspace = true
egraph-layout-multilevel.workspace = true
egraph-layout-neighbor.workspace = true
egraph-layout-sgd.workspace = true
egraph-layout-stress.workspace = true
