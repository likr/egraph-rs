name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_FONTCONFIG_DLOPEN: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust Core & Single-Thread Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          NON_BINDING_PKGS=$(python3 scripts/verify_helpers.py list-packages --exclude egraph-python --exclude egraph-wasm --format clippy-args)
          cargo clippy --no-deps --all-targets --all-features $NON_BINDING_PKGS -- -D warnings
          cargo clippy --no-deps --all-targets --no-default-features -p egraph-edge-routing -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-sgd -p egraph-layout-embedding -p egraph-layout-multilevel -p egraph-layout-refine -p egraph-layout-composite -p egraph-metrics-cluster -p egraph-metrics -p egraph -p egraph-dataset -- -D warnings
          cargo clippy --no-deps --all-targets --no-default-features --features baselines -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-multilevel -p egraph-layout-refine -p egraph-layout-composite -- -D warnings
          cargo clippy --no-deps --all-targets --features embedded -p egraph-dataset -- -D warnings

      - name: Run release tests & doctests (all-features)
        run: |
          NON_BINDING_PKGS=$(python3 scripts/verify_helpers.py list-packages --exclude egraph-python --exclude egraph-wasm --format clippy-args)
          cargo nextest run --release --all-features $NON_BINDING_PKGS
          cargo test --release --doc --all-features $NON_BINDING_PKGS

      - name: Check single-thread invariants and dependency hygiene
        run: |
          test -f clippy.toml
          grep -q "std::thread::spawn" clippy.toml
          ./scripts/check_invariants.sh --mode strict

  rust-feature-matrix:
    name: Rust Feature Matrix Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Run feature-combination release tests
        run: |
          cargo nextest run --release --no-default-features -p egraph-edge-routing -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-sgd -p egraph-layout-embedding -p egraph-layout-multilevel -p egraph-layout-refine -p egraph-layout-composite -p egraph-metrics-cluster -p egraph-metrics -p egraph -p egraph-dataset
          cargo nextest run --release --no-default-features --features baselines -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-multilevel -p egraph-layout-refine -p egraph-layout-composite
          cargo nextest run --release -p egraph -p egraph-cli -p egraph-dataset --features embedded

  semver-checks:
    name: SemVer Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-semver-checks

      - name: Check SemVer compatibility (cargo-semver-checks)
        run: |
          BASE_REV="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          if ! git rev-parse --verify "${BASE_REV}^{commit}" >/dev/null 2>&1; then
            BASE_REV="HEAD"
          fi
          BASE_VER="$(git show "${BASE_REV}:Cargo.toml" 2>/dev/null | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read()).get("workspace", {}).get("package", {}).get("version", ""))' || true)"
          CUR_VER="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text()).get("workspace", {}).get("package", {}).get("version", ""))')"
          EXTRA_FLAGS=()
          if [[ "$BASE_VER" == "$CUR_VER" && "$BASE_VER" != *alpha* ]]; then
            EXTRA_FLAGS+=(--release-type minor)
          fi
          EXISTING_PKGS=()
          for pkg in $(python3 scripts/verify_helpers.py list-packages --exclude egraph-ffi --exclude egraph-python --exclude egraph-wasm --exclude egraph-cli); do
            crate_dir="crates/${pkg#egraph-}"
            if [[ "$pkg" == "egraph" ]]; then crate_dir="crates/egraph"; fi
            if git cat-file -e "${BASE_REV}:${crate_dir}/Cargo.toml" 2>/dev/null; then
              EXISTING_PKGS+=(-p "$pkg")
            fi
          done
          if [[ "${#EXISTING_PKGS[@]}" -gt 0 ]]; then
            cargo semver-checks check-release "${EXISTING_PKGS[@]}" --baseline-rev "$BASE_REV" ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"}
          fi

  msrv:
    name: Rust MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace with MSRV 1.88.0
        run: cargo check --workspace --all-targets

  python-matrix:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: messense/maturin-action@v1
        with:
          command: build
          args: --release -o dist
          working-directory: crates/python
          manylinux: "2_28"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          uv pip install --system --force-reinstall crates/python/dist/*.whl
          uv pip install --system "numpy>=1.26" "pytest>=8.0" "scipy>=1.11" "networkx>=3.0" "igraph>=0.11" "mypy>=1.11"

      - name: Run Python test suite and parity harness
        shell: bash
        run: |
          cd crates/python
          python -m pytest tests
          cd ../..
          python scripts/parity_harness.py

      - name: Type-check Python stubs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f crates/python/python/egraph/_core.pyi ]]; then
            TYPED_PY_TESTS=(
              crates/python/tests/test_amg_and_effective_resistance.py
              crates/python/tests/test_api_options_parity.py
              crates/python/tests/test_chebyshev_mds_and_declutter.py
              crates/python/tests/test_cluster_area_faithfulness.py
              crates/python/tests/test_cluster_area_faithfulness_weights.py
              crates/python/tests/test_cluster_baselines_and_metrics_dispatch.py
              crates/python/tests/test_clustering_and_manifold.py
              crates/python/tests/test_coarse_backbone.py
              crates/python/tests/test_community_and_clustered_layouts.py
              crates/python/tests/test_constraints_and_layering.py
              crates/python/tests/test_csr_and_layout2d.py
              crates/python/tests/test_docstrings.py
              crates/python/tests/test_force_and_overlap_solvers.py
              crates/python/tests/test_force_bundling_and_validation.py
              crates/python/tests/test_geometry_and_stress_metrics.py
              crates/python/tests/test_grip_gem_sel_pfs_sfc.py
              crates/python/tests/test_gumap_refiner_and_stress_solvers.py
              crates/python/tests/test_hde_and_sgd_presets.py
              crates/python/tests/test_interop.py
              crates/python/tests/test_layout3d_polylines_and_errors.py
              crates/python/tests/test_manifold_crossings_and_metrics_report.py
              crates/python/tests/test_maxent_stress_solver.py
              crates/python/tests/test_nd_and_manifold_solvers.py
              crates/python/tests/test_neighbor_and_sgd_solvers.py
              crates/python/tests/test_neighborhood_knn_and_landmarks.py
              crates/python/tests/test_rta_crosslessness_and_metric_errors.py
              crates/python/tests/test_screened_poisson.py
              crates/python/tests/test_spatial_trees_dijkstra_and_datasets.py
              crates/python/tests/test_spectral_and_chebyshev_linalg.py
              crates/python/tests/test_tsnet_and_sgd_solvers.py
            )
            mypy --strict crates/python/python/egraph "${TYPED_PY_TESTS[@]}"
            stubtest egraph
            mypy --strict --ignore-missing-imports scripts/verify_helpers.py scripts/parity_harness.py scripts/parity/
          fi

      - name: Upload Linux wheel for docs-check
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-linux
          path: crates/python/dist/*.whl

  wasm-pipeline:
    name: WASM ESM Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            crates/wasm/package-lock.json
            package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wasm-pack and binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          sudo curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack
          wasm-pack --version

      - name: Run wasm32 check and wasm-pack test --node
        run: |
          cargo check -p egraph-wasm --target wasm32-unknown-unknown
          wasm-pack test --node crates/wasm

      - name: Build optimized web bundle and assemble pkg
        run: |
          (cd crates/wasm && wasm-pack build --target web --no-opt --profile wasm-release -d pkg .)
          if [[ -f crates/wasm/scripts/assemble_pkg.mjs ]]; then
            node crates/wasm/scripts/assemble_pkg.mjs
          fi
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int \
            crates/wasm/pkg/egraph_wasm_bg.wasm \
            -o crates/wasm/pkg/egraph_wasm_bg.wasm
          RAW_BYTES=$(wc -c < crates/wasm/pkg/egraph_wasm_bg.wasm | tr -d ' ')
          GZIP_BYTES=$(gzip -9 -c crates/wasm/pkg/egraph_wasm_bg.wasm | wc -c | tr -d ' ')
          echo "egraph_wasm_bg.wasm: raw=${RAW_BYTES} B, gzip=${GZIP_BYTES} B"
          if [[ -f crates/wasm/tests/node_esm_smoke.mjs ]]; then
            npm ci --prefix crates/wasm
            node crates/wasm/tests/node_esm_smoke.mjs
          fi
          python3 scripts/parity_harness.py --wasm-pkg crates/wasm/pkg --wasm-only
          (cd crates/wasm && npm pack --dry-run)

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('examples/web/package.json') }}

      - name: Build examples/web and run Playwright browser smoke
        run: |
          if [[ -f examples/web/package-lock.json ]]; then
            npm --prefix examples/web ci
          else
            npm --prefix examples/web install --no-audit --no-fund --no-package-lock
          fi
          npm --prefix examples/web run build
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            npx --prefix examples/web playwright install-deps chromium
          else
            npx --prefix examples/web playwright install --with-deps chromium
          fi
          node crates/wasm/tests/playwright_smoke.mjs

      - name: Upload built WASM pkg for docs-check
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg

  docs-check:
    name: Docs & Link Checks
    runs-on: ubuntu-latest
    needs: [python-matrix, wasm-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            crates/wasm/package-lock.json
            package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: python-wheel-linux
          path: crates/python/dist

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Sphinx HTML documentation and doctests
        run: |
          uv pip install --system crates/python/dist/*.whl
          uv pip install --system -r crates/python/docs/requirements.txt
          python -m sphinx -b html crates/python/docs/source crates/python/docs/_build/html
          python -m sphinx -b doctest crates/python/docs/source crates/python/docs/_build/doctest

      - name: Build TypeDoc documentation
        run: |
          npm ci --prefix crates/wasm
          npm --prefix crates/wasm run docs

      - name: Validate docs/ relative Markdown links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          docs_dir = pathlib.Path("docs")
          broken = []
          link_re = re.compile(r'\[[^\]]*\]\(([^)#\s]+)')
          for md in sorted(docs_dir.glob("*.md")):
              text = md.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      broken.append(f"{md}: broken link '{target}'")
          if broken:
              for b in broken:
                  print(f"::error::{b}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified relative links in {len(list(docs_dir.glob('*.md')))} docs/*.md files.")
          PY
