name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_FONTCONFIG_DLOPEN: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust Core & Single-Thread Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --no-deps --all-targets --all-features -p egraph-core -p egraph-ffi -p egraph-petgraph -p egraph-dataset -p egraph-spatial-trees -p egraph-spatial-fft -p egraph-spatial-crossings -p egraph-spatial -p egraph-metrics-geometry -p egraph-metrics-cluster -p egraph-metrics -p egraph-linalg -p egraph-linalg-mds -p egraph-linalg-amg -p egraph-neighborhood -p egraph-clustering -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-neighbor -p egraph-layout-sgd -p egraph-layout-multilevel -p egraph-layout -p egraph -p egraph-cli -- -D warnings
          cargo clippy --no-deps --all-targets --no-default-features -p egraph-spatial-trees -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-sgd -p egraph-layout-multilevel -p egraph-layout -p egraph-metrics-cluster -p egraph-metrics -p egraph -p egraph-dataset -- -D warnings
          cargo clippy --no-deps --all-targets --no-default-features --features baselines -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-multilevel -p egraph-layout -- -D warnings

      - name: Run release workspace tests
        run: |
          cargo test --release --workspace
          cargo test --release --all-features -p egraph-petgraph -p egraph-dataset -p egraph-spatial-trees -p egraph-spatial-fft -p egraph-spatial-crossings -p egraph-spatial -p egraph-metrics-geometry -p egraph-metrics-cluster -p egraph-metrics -p egraph-linalg -p egraph-linalg-mds -p egraph-linalg-amg -p egraph-neighborhood -p egraph-clustering -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-neighbor -p egraph-layout-sgd -p egraph-layout-multilevel -p egraph-layout -p egraph -p egraph-cli
          cargo test --release --features delaunay -p egraph-spatial -p egraph-spatial-trees -p egraph-layout-constraints -p egraph-layout-sgd -p egraph-layout-multilevel
          cargo test --release --no-default-features -p egraph-layout -p egraph-layout-constraints -p egraph-layout-sgd -p egraph-layout-multilevel -p egraph-layout-stress -p egraph-layout-force
          cargo test --release --no-default-features --features baselines -p egraph-layout -p egraph-layout-constraints -p egraph-layout-stress -p egraph-layout-force -p egraph-layout-multilevel
          cargo test --release --no-default-features -p egraph-metrics -p egraph-metrics-cluster
          cargo test --release --no-default-features -p egraph
          cargo test --release --no-default-features -p egraph-dataset

      - name: Check single-thread invariants and dependency hygiene
        run: |
          test -f clippy.toml
          grep -q "std::thread::spawn" clippy.toml
          if cargo tree --workspace --edges normal -e features | grep -E '(^|[^[:alnum:]_-])(rayon|linfa|linfa-nn|linfa-clustering|wgpu)([^[:alnum:]_-]|$)'; then
            echo "::error::workspace dependency tree pulls rayon/linfa/wgpu"
            exit 1
          fi
          for crate in egraph-core egraph-ffi egraph-petgraph egraph-dataset egraph-spatial-trees egraph-spatial-fft egraph-spatial-crossings egraph-spatial egraph-metrics-geometry egraph-metrics-cluster egraph-metrics egraph-linalg egraph-linalg-mds egraph-linalg-amg egraph-neighborhood egraph-clustering egraph-layout-constraints egraph-layout-stress egraph-layout-force egraph-layout-neighbor egraph-layout-sgd egraph-layout-multilevel egraph-layout egraph egraph-cli egraph-python egraph-wasm; do
            if cargo tree -p "$crate" --edges normal -e features | grep -E '(^|[^[:alnum:]_-])(rayon|linfa|linfa-nn|linfa-clustering|getrandom|wgpu)([^[:alnum:]_-]|$)'; then
              echo "::error::$crate dependency tree pulls forbidden crate"
              exit 1
            fi
          done
          for spec in \
            "egraph --no-default-features" \
            "egraph --all-features" \
            "egraph-dataset --no-default-features" \
            "egraph-dataset --all-features" \
            "egraph-spatial --features delaunay" \
            "egraph-spatial --all-features" \
            "egraph-spatial-trees --features delaunay" \
            "egraph-metrics --all-features" \
            "egraph-metrics-cluster --all-features" \
            "egraph-layout --no-default-features" \
            "egraph-layout --no-default-features --features baselines" \
            "egraph-layout --all-features" \
            "egraph-layout-constraints --no-default-features" \
            "egraph-layout-constraints --no-default-features --features baselines" \
            "egraph-layout-constraints --all-features" \
            "egraph-layout-stress --all-features" \
            "egraph-layout-force --all-features" \
            "egraph-layout-sgd --no-default-features" \
            "egraph-layout-sgd --features delaunay" \
            "egraph-layout-multilevel --no-default-features" \
            "egraph-layout-multilevel --no-default-features --features baselines" \
            "egraph-layout-multilevel --all-features" \
            "egraph-wasm --no-default-features"; do
            if cargo tree -p $spec --edges normal -e features | grep -E '(^|[^[:alnum:]_-])(rayon|linfa|linfa-nn|linfa-clustering|getrandom|wgpu)([^[:alnum:]_-]|$)'; then
              echo "::error::$spec dependency tree pulls forbidden crate"
              exit 1
            fi
          done
          ./scripts/check_invariants.sh --mode report

  python-matrix:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: messense/maturin-action@v1
        with:
          command: build
          args: --release -o dist
          working-directory: crates/python
          manylinux: "2_28"

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall crates/python/dist/*.whl
          python -m pip install "numpy>=1.26" "pytest>=8.0" "scipy>=1.11" "networkx>=3.0" "igraph>=0.11" "mypy>=1.11"

      - name: Run Python test suite and parity harness
        shell: bash
        run: |
          cd crates/python
          python -m pytest tests
          cd ../..
          python scripts/parity_harness.py

      - name: Type-check Python stubs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f crates/python/python/egraph/_core.pyi ]]; then
            TYPED_PY_TESTS=(
              crates/python/tests/test_amg_and_effective_resistance.py
              crates/python/tests/test_api_options_parity.py
              crates/python/tests/test_chebyshev_mds_and_declutter.py
              crates/python/tests/test_cluster_area_faithfulness.py
              crates/python/tests/test_cluster_area_faithfulness_weights.py
              crates/python/tests/test_cluster_baselines_and_metrics_dispatch.py
              crates/python/tests/test_clustering_and_manifold.py
              crates/python/tests/test_coarse_backbone.py
              crates/python/tests/test_community_and_clustered_layouts.py
              crates/python/tests/test_constraints_and_layering.py
              crates/python/tests/test_csr_and_layout2d.py
              crates/python/tests/test_docstrings.py
              crates/python/tests/test_force_and_overlap_solvers.py
              crates/python/tests/test_force_bundling_and_validation.py
              crates/python/tests/test_geometry_and_stress_metrics.py
              crates/python/tests/test_grip_gem_sel_pfs_sfc.py
              crates/python/tests/test_gumap_refiner_and_stress_solvers.py
              crates/python/tests/test_hde_and_sgd_presets.py
              crates/python/tests/test_interop.py
              crates/python/tests/test_manifold_crossings_and_metrics_report.py
              crates/python/tests/test_maxent_stress_solver.py
              crates/python/tests/test_nd_and_manifold_solvers.py
              crates/python/tests/test_neighbor_and_sgd_solvers.py
              crates/python/tests/test_neighborhood_knn_and_landmarks.py
              crates/python/tests/test_rta_crosslessness_and_metric_errors.py
              crates/python/tests/test_screened_poisson.py
              crates/python/tests/test_spatial_trees_dijkstra_and_datasets.py
              crates/python/tests/test_spectral_and_chebyshev_linalg.py
              crates/python/tests/test_tsnet_and_sgd_solvers.py
            )
            mypy --strict crates/python/python/egraph "${TYPED_PY_TESTS[@]}"
            stubtest egraph
            mypy --strict --ignore-missing-imports scripts/verify_helpers.py scripts/parity_harness.py scripts/parity/
          fi

      - name: Upload Linux wheel for docs-check
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-linux
          path: crates/python/dist/*.whl

  wasm-pipeline:
    name: WASM ESM Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wasm-pack and binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          sudo curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack
          wasm-pack --version

      - name: Check egraph-wasm --no-default-features
        run: |
          cargo check -p egraph-wasm --target wasm32-unknown-unknown --no-default-features
          cargo clippy --no-deps -p egraph-wasm --no-default-features -- -D warnings
          if cargo tree -p egraph-wasm --no-default-features --edges normal -e features | grep -E '(^|[^[:alnum:]_-])(rayon|linfa|linfa-nn|linfa-clustering|getrandom|wgpu)([^[:alnum:]_-]|$)'; then
            echo "::error::egraph-wasm --no-default-features pulls forbidden crate"
            exit 1
          fi

      - name: Run wasm32 check and wasm-pack test --node
        run: |
          cargo check -p egraph-wasm --target wasm32-unknown-unknown
          wasm-pack test --node crates/wasm
          wasm-pack test --node crates/wasm --no-default-features \
            --test coarsen_backbone_and_hde \
            --test community_clustering_and_backbone \
            --test csr_and_layout_buffers \
            --test force_multilevel_and_classic_solvers \
            --test grip_gem_sel_pfs_sfc_solvers \
            --test gumap_solver \
            --test linalg_neighborhood_boundaries \
            --test linalg_spectral_amg_resistance \
            --test manifold_layouts_and_fdeb \
            --test metrics_cluster_area \
            --test metrics_cluster_area_errors \
            --test metrics_cluster_area_weights \
            --test metrics_cluster_baselines \
            --test metrics_evaluate_and_spatial \
            --test metrics_layout_and_crossings \
            --test nd_and_manifold_solvers \
            --test neighborhood_knn_and_varadhan \
            --test overlap_and_layering_constraints \
            --test screened_poisson_field_and_refiner \
            --test sgd_barrier_and_pair_solvers \
            --test sgd_snap_pacmap_and_sgd2 \
            --test solver_stats_and_dog_getters \
            --test spatial_intruder_refiner \
            --test spatial_trees_datasets_and_linalg \
            --test stress_and_maxent_solvers \
            --test tfdp_and_ibumap_solvers \
            --test tsnet_backends_and_row_normalized \
            --test tsnet_preconditioning_and_stats

      - name: Build optimized web bundle and assemble pkg
        run: |
          (cd crates/wasm && wasm-pack build --target web --no-opt --profile wasm-release -d pkg .)
          if [[ -f crates/wasm/scripts/assemble_pkg.mjs ]]; then
            node crates/wasm/scripts/assemble_pkg.mjs
          fi
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int \
            crates/wasm/pkg/egraph_wasm_bg.wasm \
            -o crates/wasm/pkg/egraph_wasm_bg.wasm
          RAW_BYTES=$(wc -c < crates/wasm/pkg/egraph_wasm_bg.wasm | tr -d ' ')
          GZIP_BYTES=$(gzip -9 -c crates/wasm/pkg/egraph_wasm_bg.wasm | wc -c | tr -d ' ')
          echo "egraph_wasm_bg.wasm: raw=${RAW_BYTES} B, gzip=${GZIP_BYTES} B"
          if [[ -f crates/wasm/tests/node_esm_smoke.mjs ]]; then
            node crates/wasm/tests/node_esm_smoke.mjs
          fi
          python3 scripts/parity_harness.py --wasm-pkg crates/wasm/pkg --wasm-only
          (cd crates/wasm && npm pack --dry-run)

      - name: Build js/examples and run Playwright browser smoke
        run: |
          if [[ -f js/examples/package-lock.json ]]; then
            npm --prefix js/examples ci
          else
            npm --prefix js/examples install --no-audit --no-fund
          fi
          npm --prefix js/examples run build
          npx --prefix js/examples playwright install --with-deps chromium
          node crates/wasm/tests/playwright_smoke.mjs

      - name: Upload built WASM pkg for docs-check
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg

  docs-check:
    name: Docs & Link Checks
    runs-on: ubuntu-latest
    needs: [python-matrix, wasm-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: python-wheel-linux
          path: crates/python/dist

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg

      - name: Build Sphinx HTML documentation and doctests
        run: |
          python -m pip install --upgrade pip
          python -m pip install crates/python/dist/*.whl
          python -m pip install -r crates/python/docs/requirements.txt
          python -m sphinx -b html crates/python/docs/source crates/python/docs/_build/html
          python -m sphinx -b doctest crates/python/docs/source crates/python/docs/_build/doctest

      - name: Build TypeDoc documentation
        run: |
          npm ci --prefix crates/wasm
          npm --prefix crates/wasm run docs

      - name: Validate docs/ relative Markdown links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          docs_dir = pathlib.Path("docs")
          broken = []
          link_re = re.compile(r'\[[^\]]*\]\(([^)#\s]+)')
          # Historical planning snapshot entries in V6_RELEASE_PLAN.md that point outside this repo
          # or reference legacy files intentionally removed during v6 migration.
          plan_ignored = {
              "../../diffusion-kernel-experiments",
              "../.github/workflows/maturin.yml",
              "../crates/python/.github/workflows/CI.yml",
              "../crates/python/docs/netlify.toml",
              "../crates/algorithm/shortest-path/src/bfs.rs",
              "../crates/quality-metrics/src/stress.rs",
              "../crates/wasm/src/quality_metrics.rs",
              "../crates/python/src/graph/mod.rs",
              "../crates/wasm/src/edge_bundling.rs",
          }
          for md in sorted(docs_dir.glob("*.md")):
              text = md.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  if md.name == "V6_RELEASE_PLAN.md" and target in plan_ignored:
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      broken.append(f"{md}: broken link '{target}'")
          if broken:
              for b in broken:
                  print(f"::error::{b}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified relative links in {len(list(docs_dir.glob('*.md')))} docs/*.md files.")
          PY
