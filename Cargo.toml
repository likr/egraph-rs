[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/clustering",
    "crates/core",
    "crates/dataset",
    "crates/edge-routing",
    "crates/egraph",
    "crates/ffi",
    "crates/layout-composite",
    "crates/layout-constraints",
    "crates/layout-embedding",
    "crates/layout-force",
    "crates/layout-multilevel",
    "crates/layout-neighbor",
    "crates/layout-refine",
    "crates/layout-sgd",
    "crates/layout-stress",
    "crates/linalg",
    "crates/linalg-amg",
    "crates/linalg-mds",
    "crates/metrics",
    "crates/metrics-cluster",
    "crates/metrics-geometry",
    "crates/neighborhood",
    "crates/python",
    "crates/spatial-crossings",
    "crates/spatial-fft",
    "crates/spatial-trees",
    "crates/wasm",
]

[workspace.package]
version = "6.0.0-beta.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/likr/egraph-rs"
readme = "README.md"

[workspace.dependencies]
rand_core = "0.6"
rand_chacha = { version = "0.3", default-features = false }
wasm-bindgen = "0.2.104"
js-sys = "0.3"
pyo3 = { version = "0.28", features = ["abi3-py310", "extension-module"] }
numpy = "0.28"
ndarray = { version = "0.17", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egraph-rs = { path = "crates/egraph", version = "=6.0.0-beta.3" }
egraph-clustering = { path = "crates/clustering", version = "=6.0.0-beta.3" }
egraph-core = { path = "crates/core", version = "=6.0.0-beta.3" }
egraph-dataset = { path = "crates/dataset", version = "=6.0.0-beta.3" }
egraph-edge-routing = { path = "crates/edge-routing", version = "=6.0.0-beta.3" }
egraph-ffi = { path = "crates/ffi" }
egraph-layout-composite = { path = "crates/layout-composite", version = "=6.0.0-beta.3" }
egraph-layout-constraints = { path = "crates/layout-constraints", version = "=6.0.0-beta.3" }
egraph-layout-embedding = { path = "crates/layout-embedding", version = "=6.0.0-beta.3" }
egraph-layout-force = { path = "crates/layout-force", version = "=6.0.0-beta.3" }
egraph-layout-multilevel = { path = "crates/layout-multilevel", version = "=6.0.0-beta.3" }
egraph-layout-neighbor = { path = "crates/layout-neighbor", version = "=6.0.0-beta.3" }
egraph-layout-refine = { path = "crates/layout-refine", version = "=6.0.0-beta.3" }
egraph-layout-sgd = { path = "crates/layout-sgd", version = "=6.0.0-beta.3" }
egraph-layout-stress = { path = "crates/layout-stress", version = "=6.0.0-beta.3" }
egraph-linalg = { path = "crates/linalg", version = "=6.0.0-beta.3" }
egraph-linalg-amg = { path = "crates/linalg-amg", version = "=6.0.0-beta.3" }
egraph-linalg-mds = { path = "crates/linalg-mds", version = "=6.0.0-beta.3" }
egraph-metrics = { path = "crates/metrics", version = "=6.0.0-beta.3" }
egraph-metrics-cluster = { path = "crates/metrics-cluster", version = "=6.0.0-beta.3" }
egraph-metrics-geometry = { path = "crates/metrics-geometry", version = "=6.0.0-beta.3" }
egraph-neighborhood = { path = "crates/neighborhood", version = "=6.0.0-beta.3" }
egraph-spatial-crossings = { path = "crates/spatial-crossings", version = "=6.0.0-beta.3" }
egraph-spatial-fft = { path = "crates/spatial-fft", version = "=6.0.0-beta.3" }
egraph-spatial-trees = { path = "crates/spatial-trees", version = "=6.0.0-beta.3" }
spade = "2.2"

[profile.release]
opt-level = 3
lto = false

[profile.dist-release]
inherits = "release"
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
