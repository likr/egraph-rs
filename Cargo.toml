[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/cluster",
    "crates/core",
    "crates/dataset",
    "crates/egraph",
    "crates/ffi",
    "crates/layout",
    "crates/layout-constraints",
    "crates/layout-force",
    "crates/layout-multilevel",
    "crates/layout-neighbor",
    "crates/layout-sgd",
    "crates/layout-stress",
    "crates/linalg",
    "crates/linalg-amg",
    "crates/linalg-mds",
    "crates/metrics",
    "crates/metrics-cluster",
    "crates/metrics-geometry",
    "crates/neighborhood",
    "crates/petgraph",
    "crates/python",
    "crates/spatial",
    "crates/spatial-crossings",
    "crates/spatial-fft",
    "crates/spatial-trees",
    "crates/wasm",
]

[workspace.package]
version = "6.0.0-alpha.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/likr/egraph-rs"

[workspace.dependencies]
rand_core = "0.6"
rand_chacha = { version = "0.3", default-features = false }
petgraph = "0.8"
wasm-bindgen = "0.2.104"
js-sys = "0.3"
pyo3 = { version = "0.28", features = ["abi3-py310", "extension-module"] }
numpy = "0.28"
ndarray = { version = "0.17", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egraph = { path = "crates/egraph" }
egraph-clustering = { path = "crates/cluster" }
egraph-core = { path = "crates/core" }
egraph-dataset = { path = "crates/dataset" }
egraph-ffi = { path = "crates/ffi" }
egraph-layout = { path = "crates/layout" }
egraph-layout-constraints = { path = "crates/layout-constraints" }
egraph-layout-force = { path = "crates/layout-force" }
egraph-layout-multilevel = { path = "crates/layout-multilevel" }
egraph-layout-neighbor = { path = "crates/layout-neighbor" }
egraph-layout-sgd = { path = "crates/layout-sgd" }
egraph-layout-stress = { path = "crates/layout-stress" }
egraph-linalg = { path = "crates/linalg" }
egraph-linalg-amg = { path = "crates/linalg-amg" }
egraph-linalg-mds = { path = "crates/linalg-mds" }
egraph-metrics = { path = "crates/metrics" }
egraph-metrics-cluster = { path = "crates/metrics-cluster" }
egraph-metrics-geometry = { path = "crates/metrics-geometry" }
egraph-neighborhood = { path = "crates/neighborhood" }
egraph-petgraph = { path = "crates/petgraph" }
egraph-spatial = { path = "crates/spatial" }
egraph-spatial-crossings = { path = "crates/spatial-crossings" }
egraph-spatial-fft = { path = "crates/spatial-fft" }
egraph-spatial-trees = { path = "crates/spatial-trees" }
spade = "2.2"

[profile.release]
opt-level = 3
lto = false

[profile.dist-release]
inherits = "release"
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
